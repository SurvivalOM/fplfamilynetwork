name: TEMP link verification
on: push
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Discover real URLs on the parent site
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'
          curl -sS -A "$UA" -L https://futureproofinglifestyle.com/ -o /tmp/home.html
          echo "===== internal links on futureproofinglifestyle.com ====="
          grep -o -E 'href="[^"]+"' /tmp/home.html | sed 's/href="//; s/"$//' \
            | grep -v -E '^(#|mailto:|tel:|https?://(fonts|cdn|www\.google))' | sort -u
          echo
          echo "===== candidate replacements ====="
          for p in pricing join terms privacy refund contact \
                   pricing/ join/ terms/ privacy/ refund/ contact/ ; do
            code=$(curl -sS -A "$UA" -o /dev/null -w '%{http_code}' -L --max-time 20 \
                   "https://futureproofinglifestyle.com/$p")
            printf '%-6s /%s\n' "$code" "$p"
          done
